<script>
(function() {
  var KEY = "aamp_theme";
  function read() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" || v === "auto" ? v : "light";
    } catch (_) {
      return "light";
    }
  }
  var TOOLKIT_KEY = "adtraction-allow-dark-mode";
  function mirror(pref) {
    var want = resolve(pref, systemPrefersDark()) === "dark" ? "on" : "off";
    try {
      if ((localStorage.getItem(TOOLKIT_KEY) || "off") !== want) localStorage.setItem(TOOLKIT_KEY, want);
    } catch (_) {
    }
  }
  function write(pref) {
    try {
      localStorage.setItem(KEY, pref);
    } catch (_) {
    }
    mirror(pref);
  }
  function systemPrefersDark() {
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function resolve(pref, sysDark) {
    return pref === "light" || pref === "dark" ? pref : sysDark ? "dark" : "light";
  }
  function apply(pref) {
    var resolved = resolve(pref, systemPrefersDark());
    document.documentElement.setAttribute("data-theme", resolved);
    return resolved;
  }
  window.AAMP_THEME = {
    KEY,
    read,
    write,
    resolve,
    systemPrefersDark,
    apply
  };
  mirror(read());
  apply(read());
})();
</script>

@keyframes shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
@property --ov-t { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --ov-b { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --ov-l { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --ov-r { syntax: "<length>"; inherits: false; initial-value: 0px; }

    linear-gradient(
      to bottom,
      transparent,
      #000 var(--ov-t),
      #000 calc(100% - var(--ov-b)),
      transparent),
    linear-gradient(
      to right,
      transparent,
      #000 var(--ov-l),
      #000 calc(100% - var(--ov-r)),
      transparent);
  -webkit-mask-image: var(--ov-mask);
  -webkit-mask-composite: source-in;
  mask-image: var(--ov-mask);
  mask-composite: intersect;
  transition:
    --ov-t .15s,
    --ov-b .15s,
    --ov-l .15s,
    --ov-r .15s;
}

.conv-header {
  display: flex;
  align-items: center;
  gap: var(--size-space-200);
  position: relative;
  padding: var(--size-space-300) var(--col-right) var(--size-space-300) var(--col-left);
  flex-shrink: 0;
}
.chat-log-frame {
  position: relative;
  isolation: isolate;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
#chatLog {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px clamp(12px, 4%, 40px);
  padding-left: calc(clamp(12px, 4%, 40px) + 44px);
  padding-left: var(--col-left);
  padding-right: var(--col-right);
  padding-bottom: calc(var(--composer-h, 150px) + 8px);
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
  min-width: 0;
}
#chatLog > * {
  flex-shrink: 0;
}
.msg {
  font-size: 14px;
  line-height: 1.65;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.msg.user {
  max-width: 80%;
  align-self: flex-end;
  background: var(--lilac);
  color: var(--text-body);
  padding: 12px 16px;
  border-radius: 8px;
  white-space: pre-wrap;
}
.msg.assistant {
  background: var(--sky);
  color: var(--text-body);
  padding: 12px 16px;
  border-radius: var(--size-radius-100) var(--size-radius-200) var(--size-radius-200) var(--size-radius-200);
  overflow-x: auto;
}
.msg.error {
  align-self: flex-start;
  background: var(--error-container);
  color: var(--error);
  padding: 12px 18px;
  border-radius: 8px;
}
.day-divider {
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.day-divider::before,
.day-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--skeleton);
}
.compact-divider {
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 4px;
  font-size: 11px;
  color: var(--outline);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.compact-divider::before,
.compact-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--outline-variant);
}
.compact-box {
  align-self: stretch;
  margin: 12px 0;
  background: var(--sky-0);
  border: 1px solid var(--sky);
  border-radius: 8px;
  overflow: hidden;
}
.compact-box > summary,
.compact-box-head {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--on-surface);
}
.compact-box--static .compact-box-head {
  cursor: default;
}
.compact-box > summary::-webkit-details-marker {
  display: none;
}
.compact-box > summary::marker {
  content: "";
}
.compact-box-icon {
  font-size: 18px;
  color: var(--adtraction-blue);
}
.compact-box-title {
  flex: 0 0 auto;
}
.compact-box-hint {
  margin-left: auto;
  font-size: 11px;
  font-weight: 400;
  color: var(--on-surface-variant);
}
.compact-box-chevron {
  font-size: 18px;
  color: var(--on-surface-variant);
  transition: transform 0.2s ease;
}
.compact-box[open] .compact-box-chevron {
  transform: rotate(180deg);
}
.compact-box[open] .compact-box-hint::after {
  content: " (collapse)";
}
.compact-box-body {
  margin: 0;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--sky);
  font-size: 13px;
  line-height: 1.5;
  color: var(--on-surface);
  white-space: pre-wrap;
  font-family: inherit;
  overflow-x: auto;
}
.load-older-btn {
  align-self: center;
  margin: 8px 0 12px;
  padding: 6px 16px;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: 999px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--on-surface-variant);
  cursor: pointer;
}
.load-older-btn:hover {
  background: var(--surface-container-high);
}
.load-older-btn:disabled {
  cursor: default;
  opacity: 0.6;
}
.thinking-stream-bubble {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: var(--size-space-300) var(--size-space-400);
  border-radius: var(--size-radius-100) var(--size-radius-200) var(--size-radius-200) var(--size-radius-200);
  background: var(--sky);
  color: var(--text-body);
  font-size: var(--font-size-small);
  line-height: 1.65;
  overflow-wrap: anywhere;
}
@media (max-width: 768px) {
  .thinking-stream-bubble {
    padding: 14px var(--size-space-400);
  }
}
.thinking-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.thinking-mark-tip {
  display: inline-flex;
}
.thinking-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.thinking-collapsed summary,
.thinking-stream-header {
  display: flex;
  align-items: center;
  gap: var(--size-space-100);
  width: fit-content;
  max-width: 100%;
  padding: var(--size-space-100) 0;
  border: 0;
  border-radius: var(--size-radius-100);
  background: none;
  font: inherit;
  font-size: var(--font-size-2x-small);
  line-height: 1.5;
  color: var(--text-muted);
  text-align: left;
  list-style: none;
  cursor: pointer;
  user-select: none;
  transition: color var(--transition-speed-default) ease-in-out;
}
.thinking-stream-header {
  gap: var(--size-space-150);
}
.thinking-collapsed summary::-webkit-details-marker {
  display: none;
}
:is(.thinking-collapsed summary, .thinking-stream-header, .tool-card-header):focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
@media (hover: hover) and (pointer: fine) {
  :is(.thinking-collapsed summary, .thinking-stream-header):hover,
  .tool-card-header:hover .thinking-chevron {
    color: var(--text-body);
  }
}
.thinking-chevron {
  width: 0.875rem;
  transition: color var(--transition-speed-default) ease-in-out, transform var(--transition-speed-default) ease-in-out;
}
.thinking-collapsed details[open] > summary .thinking-chevron,
:is(.thinking-stream-header, .tool-card-header)[aria-expanded=true] .thinking-chevron {
  transform: rotate(90deg);
}
.thinking-stream-skills {
  display: flex;
  flex-direction: column;
  padding-top: var(--size-space-100);
}
.thinking-stream-skills:empty,
.thinking-stream[data-open=true] .thinking-stream-skills {
  display: none;
}
.thinking-stream-history-wrap {
  display: grid;
  grid-template-rows: 0fr;
  overflow-x: visible;
  overflow-y: clip;
  visibility: hidden;
  transition: grid-template-rows var(--transition-speed-slow) ease-in-out, visibility 0s linear var(--transition-speed-slow);
}
.thinking-stream[data-open=true] .thinking-stream-history-wrap {
  grid-template-rows: 1fr;
  visibility: visible;
  transition: grid-template-rows var(--transition-speed-slow) ease-in-out;
}
.thinking-stream-history-wrap:has(> :empty) {
  display: none;
}
.thinking-stream-history {
  min-height: 0;
  padding-top: var(--size-space-200);
}
.thinking-stream-current {
  display: none;
  flex-direction: column;
  gap: var(--size-space-100);
  padding-top: var(--size-space-200);
}
.thinking-stream-current:has(> :not(:empty)) {
  display: flex;
}
.thinking-stream-current > :empty {
  display: none;
}
.thinking-stream--compacting > .msg-author {
  display: none;
}
.thinking-stream--compacting > .thinking-stream-bubble {
  padding: 0;
  background: none;
}
.thinking-stream--compacting .thinking-stream-header {
  padding: var(--size-space-100) var(--size-space-300);
  border: 1px solid var(--sky);
  border-radius: var(--size-radius-200);
  background: var(--sky-0);
  color: var(--on-surface);
}
.thinking-stream-history,
.thinking-collapsed .thinking-body {
  display: flex;
  flex-direction: column;
  gap: var(--size-space-150);
}
.thinking-stream-history:not(:empty),
.thinking-collapsed .thinking-body {
  padding: var(--size-space-300);
  border-radius: var(--size-radius-300);
  background: var(--grayscale-50);
}
.thinking-collapsed details[open] > summary,
.thinking-stream[data-open=true]:has(.thinking-stream-history:not(:empty)) .thinking-stream-header {
  padding-bottom: var(--size-space-200);
}
:is(.thinking-stream-history, .thinking-collapsed .thinking-body) .tool-card-details,
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) :is(.thinking-stream-history, .thinking-body) .thinking-stream-step-text :is(code, pre) {
  background: var(--grayscale-0);
}
.thinking-stream-step {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.thinking-stream-step-text {
  display: flex;
  flex-direction: column;
  gap: var(--size-space-150);
  font-size: var(--font-size-2x-small);
  line-height: 1.5;
  color: var(--text-muted);
  text-wrap: pretty;
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text :is(p, ul, ol, li, pre, h1, h2, h3, h4) {
  margin: 0;
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text :is(ul, ol) {
  padding-left: var(--size-space-500);
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text :is(h1, h2, h3, h4) {
  font-size: inherit;
  font-weight: var(--font-weight-medium);
  color: var(--text-body);
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text strong {
  font-weight: var(--font-weight-medium);
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text code {
  padding: 0 var(--size-space-100);
  border-radius: var(--size-radius-100);
  background: var(--grayscale-50);
  font-family: var(--font-family-monospace);
  font-size: 0.92em;
  color: var(--text-body);
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text pre {
  padding: var(--size-space-200) var(--size-space-300);
  border-radius: var(--size-radius-200);
  background: var(--grayscale-50);
  overflow-x: auto;
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .thinking-stream-step-text pre code {
  padding: 0;
  background: none;
}
.tool-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.tool-card-header,
.skill-indicator {
  display: flex;
  align-items: flex-start;
  gap: var(--size-space-200);
  max-width: 100%;
  padding: var(--size-space-100) 0;
  font-size: var(--font-size-small);
  line-height: 1.43;
  color: var(--text-body);
}
.tool-card-header {
  width: fit-content;
  border: 0;
  border-radius: var(--size-radius-100);
  background: none;
  font-family: inherit;
  font-weight: var(--font-weight-regular);
  text-align: left;
  cursor: pointer;
}
.skill-indicator {
  align-items: center;
}
.thinking-step-status {
  width: var(--size-space-500);
  height: 1lh;
  color: var(--text-muted);
}
:is(.tool-card, .skill-indicator)[data-state=error] .thinking-step-status {
  color: var(--chip-negative-fg);
}
.tool-card-name {
  min-width: 0;
  text-wrap: pretty;
}
.tool-card-header .thinking-chevron {
  height: 1lh;
  color: var(--text-muted);
}
.skill-indicator-tag {
  min-width: 0;
  font-size: var(--font-size-2x-small);
  --tag-text: var(--text-muted);
}
.skill-indicator-tag[data-tip] {
  cursor: help;
}
.tool-card-body {
  display: grid;
  grid-template-rows: 0fr;
  overflow-x: visible;
  overflow-y: clip;
  visibility: hidden;
  transition: grid-template-rows var(--transition-speed-slow) ease-in-out, visibility 0s linear var(--transition-speed-slow);
}
.tool-card-header[aria-expanded=true] + .tool-card-body {
  grid-template-rows: 1fr;
  visibility: visible;
  transition: grid-template-rows var(--transition-speed-slow) ease-in-out;
}
.tool-card-inset {
  min-height: 0;
  padding: var(--size-space-100) 0 var(--size-space-100) calc(var(--size-space-500) + var(--size-space-200));
}
.tool-card-details {
  display: flex;
  flex-direction: column;
  gap: var(--size-space-300);
  padding: var(--size-space-300);
  border-radius: var(--size-radius-200);
  background: var(--grayscale-50);
}
.tool-card-section {
  display: flex;
  flex-direction: column;
  gap: var(--size-space-100);
  min-width: 0;
}
.tool-card-section-label {
  font-size: var(--font-size-2x-small);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
  color: var(--text-muted);
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .tool-card-section pre {
  max-height: 12.5rem;
  margin: 0;
  padding: 0;
  border-radius: 0;
  background: none;
  overflow: auto;
  font-family: var(--font-family-monospace);
  font-size: var(--font-size-2x-small);
  line-height: 1.5;
  color: var(--text-body);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
:is(.msg.assistant, .thinking-stream, .thinking-collapsed) .tool-card-error pre {
  color: var(--chip-negative-fg);
}
.thinking-collapsed {
  width: 100%;
  box-sizing: border-box;
  padding-bottom: var(--size-space-200);
  interpolate-size: allow-keywords;
}
.thinking-collapsed details::details-content {
  block-size: 0;
  overflow-x: visible;
  overflow-y: clip;
  transition: block-size var(--transition-speed-slow) ease-in-out, content-visibility var(--transition-speed-slow) allow-discrete;
}
.thinking-collapsed details[open]::details-content {
  block-size: auto;
}
.thinking-collapsed details[open] .thinking-body {
  animation: thinking-reveal var(--transition-speed-slow) ease-out;
}
@keyframes thinking-reveal {
  from {
    opacity: 0;
    transform: translateY(calc(var(--size-space-100) * -1));
  }
}
@media (pointer: coarse) {
  .thinking-collapsed summary,
  .thinking-stream-header,
  .tool-card-header {
    padding-block: var(--size-space-300);
  }
}
@media (prefers-reduced-motion: reduce) {
  .thinking-collapsed summary,
  .thinking-stream-header,
  .thinking-chevron,
  .thinking-stream-history-wrap,
  .tool-card-body,
  .thinking-collapsed details::details-content {

  return { open: openFile, openBrowser, close, refresh, isOpen };
})();
</script>
