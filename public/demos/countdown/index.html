<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yet Another Countdown Live Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #ececec;
    font: 13px/1.4 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: #1e1e1e;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px;
  }
  .phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; }
  .phone {
    /* A real iPhone-sized screen (376x816) so the app gets its true layout,
       zoomed down so the whole phone fits a laptop screen. */
    width: 396px; height: 836px; zoom: 0.74;
    border-radius: 48px;
    padding: 10px;
    background: #111;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12), 0 18px 40px rgba(0,0,0,0.22);
  }
  /* The screen clips on a wrapper: border-radius on an iframe alone lets
     composited layers inside it (blurred bars) paint past the corners. */
  .screen {
    height: 100%; border-radius: 38px; overflow: hidden;
    clip-path: inset(0 round 38px); isolation: isolate; transform: translateZ(0);
  }
  .phone iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .bar { display: flex; gap: 12px; align-items: center; color: #757575; font-size: 12px; }
  .bar button {
    font: inherit; color: #1e1e1e; background: #fff;
    border: 1px solid rgba(0,0,0,0.12); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
  }
  .bar button:hover { background: #f5f5f5; }
</style>
</head>
<body>
  <main class="stage">
    <div class="phones">
      <div class="phone">
        <div class="screen"><iframe id="app" title="Yet Another Countdown app" src="about:blank"></iframe></div>
      </div>
      <div class="phone">
        <div class="screen"><iframe id="home" title="Home screen with the Countdown widget" src="about:blank"></iframe></div>
      </div>
    </div>
    <div class="bar">
      <span>Add a countdown in the app, then tap the widget on the home screen to edit it.</span>
      <button type="button" id="reset">Reset demo</button>
    </div>
  </main>
<script>
(function () {
  'use strict';
  // portfolio edit: seed a few sample countdowns so the list isn't empty on first visit.
  // The app reads and writes localStorage 'countdowns' (same origin as this page).
  var DAY = 864e5;
  function at(days) { return new Date(Date.now() + days * DAY).toISOString(); }
  function seed() {
    var now = new Date().toISOString();
    var events = [
      { id: 'demo-1', title: 'Summer holiday', targetDate: at(38), emoji: '🏖️', emojiColor: '#3090bf', emojiShape: 'squircle', isRecurring: false, createdAt: now },
      { id: 'demo-2', title: 'Mum’s birthday', targetDate: at(12), emoji: '🎂', emojiColor: '#c94b8c', emojiShape: 'heart', isRecurring: true, createdAt: now },
      { id: 'demo-3', title: 'Concert', targetDate: at(4), emoji: '🎸', emojiColor: '#8533b8', emojiShape: 'circle', isRecurring: false, createdAt: now },
      { id: 'demo-4', title: 'Quit sugar', targetDate: at(-23), emoji: '🍭', emojiColor: '#bfbf40', emojiShape: 'flower', isRecurring: false, createdAt: now }
    ];
    try {
      localStorage.setItem('countdowns', JSON.stringify(events));
      localStorage.setItem('countdownsLastUpdated', now);
      localStorage.removeItem('countdownsDeleted');
      localStorage.setItem('firstRunShown', '1');
    } catch (e) { /* storage blocked: the app still runs, just empty */ }
  }
  var app = document.getElementById('app');
  var home = document.getElementById('home');
  // Bump V on every demo rebuild so browsers don't keep a cached app shell.
  var V = '8';
  var SRC = 'app/?v=' + V;
  var HOME = 'app/homescreen.html?v=' + V;
  try { if (!localStorage.getItem('countdowns')) seed(); } catch (e) {}
  app.src = SRC;
  home.src = HOME;
  document.getElementById('reset').addEventListener('click', function () {
    seed();
    try { localStorage.removeItem('demoHomeWidget'); } catch (e) {}
    app.src = 'about:blank';
    home.src = 'about:blank';
    setTimeout(function () { app.src = SRC; home.src = HOME; }, 30);
  });
})();
</script>
</body>
</html>
