<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Email triage pipeline</title>
  <desc id="desc">A dark architectural illustration: Gmail and iCloud mail flow into a rules classifier on a Linux host, which writes labels and sends a rate-limited iMessage ping that a thumbs-up tapback grades.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182b42"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77e0c3"/>
      <stop offset="1" stop-color="#63a7ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="380" cy="330" r="240" fill="#62d9b7" opacity=".10" filter="url(#blur)"/>
  <circle cx="1240" cy="560" r="250" fill="#5c9dff" opacity=".12" filter="url(#blur)"/>

  <!-- sources -->
  <g transform="translate(140 170)">
    <rect width="400" height="150" rx="24" fill="#111d2e" stroke="#77e0c3" stroke-width="2"/>
    <circle cx="58" cy="52" r="10" fill="#77e0c3"/>
    <text x="84" y="60" fill="#f2f7ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">GMAIL</text>
    <text x="38" y="110" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="21">API · labels · nightly unsubscribe</text>
  </g>
  <g transform="translate(140 400)">
    <rect width="400" height="150" rx="24" fill="#111d2e" stroke="#77e0c3" stroke-width="2"/>
    <circle cx="58" cy="52" r="10" fill="#77e0c3"/>
    <text x="84" y="60" fill="#f2f7ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">ICLOUD · MAIL.APP</text>
    <text x="38" y="110" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="21">read-only export · 2017 MacBook</text>
  </g>

  <!-- flow lines into classifier -->
  <path d="M 560 245 C 660 245 680 330 760 350" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".75"/>
  <path d="M 560 475 C 660 475 680 420 760 400" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".75"/>

  <!-- classifier -->
  <g transform="translate(770 250)">
    <rect width="460" height="300" rx="28" fill="#111d2e" stroke="#63a7ff" stroke-width="2"/>
    <rect x="30" y="30" width="400" height="64" rx="16" fill="#1b2c42"/>
    <circle cx="67" cy="62" r="11" fill="#63a7ff"/>
    <text x="96" y="71" fill="#f2f7ff" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">RULES CLASSIFIER · GX10</text>
    <text x="38" y="150" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="21">G1–G12 rules · F0/F1 gates</text>
    <text x="38" y="190" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="21">a written reason per decision</text>
    <text x="38" y="230" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="21">every 10 min · verdict ledger</text>
    <text x="38" y="270" fill="#77e0c3" font-family="Inter,Arial,sans-serif" font-size="21">miss → rule → regression test</text>
  </g>

  <!-- outputs -->
  <path d="M 1250 330 C 1330 320 1360 260 1420 235" fill="none" stroke="#fff" stroke-width="1.5" opacity=".35" stroke-dasharray="8 12"/>
  <path d="M 1250 420 C 1340 440 1370 520 1420 560" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".8"/>

  <g transform="translate(1340 120)">
    <rect width="210" height="130" rx="20" fill="#111d2e" stroke="#77e0c3" stroke-width="2"/>
    <text x="28" y="52" fill="#f2f7ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">LABELS</text>
    <text x="28" y="92" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="20">needs-me · waiting</text>
    <text x="28" y="122" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="20">filed · bot-handling</text>
  </g>

  <!-- phone with ping -->
  <g transform="translate(1352 480)">
    <rect width="196" height="330" rx="30" fill="#0d1626" stroke="#63a7ff" stroke-width="2"/>
    <rect x="14" y="14" width="168" height="302" rx="20" fill="#e9eaee"/>
    <rect x="28" y="36" width="140" height="86" rx="18" fill="#0b93f6"/>
    <text x="40" y="66" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">iCloud: 5 needs-me</text>
    <text x="40" y="90" fill="#dbeaff" font-family="Inter,Arial,sans-serif" font-size="13">1. Netflix — payment</text>
    <text x="40" y="110" fill="#dbeaff" font-family="Inter,Arial,sans-serif" font-size="13">2. Temu — recall</text>
    <rect x="28" y="136" width="120" height="34" rx="17" fill="#0b93f6"/>
    <text x="44" y="158" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14">+ 3 more</text>
    <circle cx="40" cy="200" r="16" fill="#e9eaee" stroke="#0b93f6" stroke-width="2"/>
    <text x="32" y="207" font-family="Inter,Arial,sans-serif" font-size="17">👍</text>
    <text x="66" y="206" fill="#5a6b7d" font-family="Inter,Arial,sans-serif" font-size="14">tapback = all correct</text>
  </g>

  <!-- ping policy note -->
  <g transform="translate(770 620)">
    <text x="0" y="0" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="22">ping policy: max 2/day · 3h apart · quiet hours ·</text>
    <text x="0" y="36" fill="#b7c9d8" font-family="Inter,Arial,sans-serif" font-size="22">never about mail already read · never empty</text>
  </g>

  <path d="M 1445 480 C 1445 430 1300 760 1120 720 S 830 700 800 560" fill="none" stroke="#77e0c3" stroke-width="1.5" opacity=".30" stroke-dasharray="4 10"/>
  <text x="1030" y="780" fill="#77e0c3" font-family="Inter,Arial,sans-serif" font-size="20" opacity=".8">grades feed the verdict ledger</text>
</svg>
